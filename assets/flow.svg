"#3a2a63" stroke-width="2"/><text class="c m dm" x="1151" y="189">say</text><g opacity="0"><rect x="1121" y="164" width="60" height="36" rx="10" fill="#332055" stroke="#a66bff" stroke-width="2.5"/><text class="c m" x="1151" y="189">say</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.475;.485;.5692;.5792;1"/></g><g opacity="0"><text class="c gr" x="1110" y="237" font-weight="600">answers in the chat</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7292;.7458;.775;.7917;1"/></g>
