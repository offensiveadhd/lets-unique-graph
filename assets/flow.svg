<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-labelledby="gf-t gf-d">
<title id="gf-t">How Claude drives graph</title>
<desc id="gf-d">The graph board on the left, Claude on the right, two lanes between them. Events go up from the board: graph.node.create when you draw a node, graph.ask when you ask about a selection, graph.export when you press Send to Claude. Commands come down from Claude: graph.node.add puts a node beside yours, graph.highlight points at the nodes an answer means, graph.load brings a saved board back. The session block names graph.export as the export, graph.snapshot as the snapshot and graph.load as the restore.</desc>
