 repeatCount="indefinite" values="342 104;342 104;978 104;978 104;342 104;342 104" keyTimes="0;.65;.7292;.7458;.7475;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6417;.65;.7333;.7417;1"/></g><g opacity="0" transform="translate(978 184)"><circle r="17" fill="#ff6bd6" fill-opacity=".2"/><circle r="8.5" fill="#ff6bd6"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="978 184;978 184;342 184;342 184;978 184;978 184" keyTimes="0;.8083;.8875;.9042;.9058;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.8;.8083;.8917;.9;1"/></g>
<g opacity="1"><text x="40" y="300" font-size="22">You draw a node on the board.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.1458;.1583;.9833;.9958;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude adds the next step beside it, animated and on your undo stack.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.1583;.1708;.3042;.3167;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">You select nodes and ask, or pick a question from Doto's menu.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.3167;.3292;.4625;.475;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Claude answers in the chat panel and points at the nodes it means.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.475;.4875;.6208;.6333;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Send to Claude: the engine saves the board and the window closes.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6333;.6458;.7792;.7917;1"/></g>
<g opacity="0"><text x="40" y="300" font-size="22">Say continue: a fresh window opens and the saved board comes back.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7917;.8042;.9583;.9708;1"/></g>
<text class="dm" x="40" y="348" font-size="20">session block</text><rect x="196" y="323" width="290" height="36" rx="10" fill="#1a1030" fill-opacity=".7" stroke="#3a2a63" stroke-width="2"/><g opacity="0"><rect x="196" y="323" width="290" height="36" rx="10" fill="#263945" stroke="#5ef2a6" stroke-width="2.5"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7292;.7458;.775;.7917;1"/></g><text class="dm" x="212" y="348" font-size="20">export<tspan class="m pl" dx="10">graph.export</tspan></text><rect x="498" y="323" width="350" height="36" rx="10" fill="#1a1030" fill-opacity=".7" stroke="#3a2a63" stroke-width="2"/><text class="dm" x="514" y="348" font-size="20">snapshot<tspan class="m pl" dx="10">graph.snapshot</tspan></text><rect x="860" y="323" width="380" height="36" rx="10" fill="#1a1030" fill-opacity=".7" stroke="#3a2a63" stroke-width="2"/><g opacity="0"><rect x="860" y="323" width="380" height="36" rx="10" fill="#263945" stroke="#5ef2a6" stroke-width="2.5"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.8875;.9042;.9542;.9708;1"/></g><text class="dm" x="876" y="348" font-size="20">restore<tspan class="m pl" dx="10">graph.load</tspan></text>
