<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="gb-t gb-d">
<title id="gb-t">graph</title>
<desc id="gb-d">graph: talk to Claude in diagrams. On a dark board the pointer adds two nodes and drags an edge between them. Three more nodes arrive from Claude, the board settles into a tree, and Doto, a violet orb beside it, says: Five nodes, four edges. Neat.</desc>
<style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,"Cascadia Code",SFMono-Regular,Menlo,Consolas,monospace}</style>
